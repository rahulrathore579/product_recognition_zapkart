<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Payment - ZapKart</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-color: #ff6f00;
      --secondary-color: #28a745;
      --light-bg: #f8f9fa;
      --dark-text: #343a40;
      --light-text: #6c757d;
      --white: #fff;
      --shadow: rgba(0,0,0,0.1);
      --hover-shadow: rgba(0,0,0,0.2);
    }

    body {
      background-color: var(--light-bg);
      font-family: 'Poppins', sans-serif;
      color: var(--dark-text);
      line-height: 1.6;
    }

    /* --- Navbar --- */
    .navbar {
      position: sticky;
      top: 0;
      z-index: 1030;
      padding: 0.75rem 1.5rem;
      background-color: var(--white) !important;
      box-shadow: 0 2px 10px var(--shadow);
      min-height: 80px;
    }

    .navbar-brand {
      font-weight: 700;
      color: var(--primary-color) !important;
      font-size: 2rem;
      transition: color 0.3s ease;
    }

    .navbar-brand:hover {
      color: #e06000 !important;
    }

    .nav-item {
      margin: 0 10px;
      font-weight: 600;
    }

    .nav-link {
      color: var(--dark-text) !important;
      padding: 8px 15px;
      border-radius: 25px;
      transition: all 0.3s ease;
    }

    .nav-link:hover {
      background-color: #e0ffb3;
      color: var(--secondary-color) !important;
      font-size: 1.05rem;
    }

    .nav-item .nav-link.active {
        background-color: var(--secondary-color);
        color: var(--white) !important;
    }

    .btn-outline-primary {
        border-color: var(--primary-color);
        color: var(--primary-color);
        transition: all 0.3s ease;
    }

    .btn-outline-primary:hover {
        background-color: var(--primary-color);
        color: var(--white);
    }

    /* --- Page Specific Styles --- */
    .pay-container {
      margin-top: 60px; /* Aligned with other page content sections */
      margin-bottom: 80px;
      display: flex; /* Use flexbox for centering */
      justify-content: center;
      align-items: center;
      min-height: calc(100vh - 80px - 80px); /* Full viewport height minus navbar/bottom margin */
    }

    .payment-box {
      background-color: var(--white);
      border-radius: 15px; /* More rounded corners */
      padding: 40px 50px; /* Increased padding */
      box-shadow: 0 8px 25px var(--shadow); /* Stronger, softer shadow */
      text-align: center;
      max-width: 550px; /* Control width */
      width: 100%;
    }

    h2 {
      font-size: 2.8rem;
      font-weight: 700;
      color: var(--dark-text);
      margin-bottom: 2rem;
      position: relative;
      padding-bottom: 10px;
    }

    h2::after {
      content: '';
      position: absolute;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      width: 80px;
      height: 4px;
      background-color: var(--primary-color);
      border-radius: 2px;
    }

    .lead {
      font-size: 1.25rem; /* Larger lead text */
      color: var(--light-text);
      margin-bottom: 2.5rem; /* More space below lead text */
    }

    /* Razorpay button styling (override default if needed, or let Razorpay style it) */
    .razorpay-payment-button {
      background-color: var(--secondary-color) !important;
      border: none !important;
      font-size: 1.1rem !important;
      padding: 15px 40px !important;
      border-radius: 50px !important; /* Pill shape */
      font-weight: 600 !important;
      color: var(--white) !important;
      transition: background-color 0.3s ease, transform 0.2s ease, box-shadow 0.2s ease !important;
      cursor: pointer !important;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2) !important;
    }

    .razorpay-payment-button:hover {
      background-color: #218838 !important;
      transform: translateY(-3px) !important;
      box-shadow: 0 8px 15px rgba(0,0,0,0.3) !important;
    }

    .video-bg {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      min-width: 100%;
      min-height: 100%;
      width: auto;
      height: auto;
      opacity: 0.05;
      z-index: -1;
      object-fit: cover;
    }

    .empty-msg { /* If there's an empty cart scenario for payment */
      font-size: 1.5rem;
      color: var(--light-text);
      margin-top: 80px;
      padding: 40px;
      background-color: var(--white);
      border-radius: 15px;
      box-shadow: 0 4px 15px var(--shadow);
    }

    @media (max-width: 768px) {
      .pay-container {
        margin-top: 30px;
        min-height: calc(100vh - 60px - 60px);
      }
      .payment-box {
        padding: 30px 25px;
        border-radius: 10px;
      }
      h2 {
        font-size: 2.2rem;
        margin-bottom: 1.5rem;
      }
      .lead {
        font-size: 1.1rem;
        margin-bottom: 2rem;
      }
      .razorpay-payment-button {
        padding: 12px 30px !important;
        font-size: 1rem !important;
      }
    }

    @media (max-width: 576px) {
      h2 {
        font-size: 1.8rem;
      }
      .lead {
        font-size: 1rem;
      }
    }
  </style>

</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-light">
    <div class="container">
      <a class="navbar-brand" href="/">ZapKart</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          {% if current_user.is_authenticated %}
            <li class="nav-item"><a class="nav-link" href="/cart">My Cart</a></li>
            <li class="nav-item"><a class="nav-link" href="/scan">Scan Product</a></li>
            <li class="nav-item"><a class="nav-link" href="/logout">Logout</a></li>
          {% else %}
            <li class="nav-item"><a class="nav-link" href="/login">Login</a></li>
            <li class="nav-item"><a class="nav-link" href="/signup">Sign Up</a></li>
          {% endif %}
          <li class="nav-item">
            <form class="d-flex ms-lg-3" action="/search" method="get">
              <input class="form-control me-2" type="search" name="q" placeholder="Search" aria-label="Search">
              <button class="btn btn-outline-primary" type="submit">Search</button>
            </form>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <video class="video-bg" autoplay muted loop playsinline>
    <source src="/static/zapkart_logo.mp4" type="video/mp4">
    Your browser does not support the video tag.
  </video>

  <div class="container pay-container">
    <div class="payment-box">
      <h2>Complete Your Purchase</h2>
      <p class="lead">Your order is ready! Click below to proceed with the secure payment.</p>
      <form action="/payment_success" method="POST">
        <script
          src="https://checkout.razorpay.com/v1/checkout.js"
          data-key="{{ razorpay_key }}"
          data-amount="{{ total_amount }}"
          data-currency="INR"
          data-order_id="{{ razorpay_order_id }}"
          data-buttontext="Pay Now"
          data-name="ZapKart"
          data-description="Smart Purchase"
          data-theme.color="#ff6f00"
        ></script>
        <input type="hidden" name="user_email" value="{{ user.email }}">
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
