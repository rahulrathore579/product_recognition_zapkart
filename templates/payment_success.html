<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Payment Success - ZapKart</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-color: #ff6f00;
      --secondary-color: #28a745;
      --light-bg: #f8f9fa;
      --dark-text: #343a40;
      --light-text: #6c757d;
      --white: #fff;
      --shadow: rgba(0,0,0,0.1);
      --hover-shadow: rgba(0,0,0,0.2);
    }

    body {
      background-color: var(--light-bg);
      font-family: 'Poppins', sans-serif;
      color: var(--dark-text);
      line-height: 1.6;
      display: flex; /* Use flexbox to vertically center content */
      justify-content: center;
      align-items: center;
      min-height: 100vh; /* Full viewport height */
      margin: 0;
    }

    .success-container {
      max-width: 600px;
      margin: 40px auto; /* Add some vertical margin for smaller screens */
      text-align: center;
      background-color: var(--white);
      padding: 50px; /* Increased padding */
      border-radius: 20px; /* More rounded corners */
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15); /* Stronger, softer shadow */
      border: 1px solid #e0e0e0; /* Subtle border */
    }

    .success-icon {
      font-size: 70px; /* Larger icon */
      color: var(--secondary-color); /* Use secondary color for success */
      margin-bottom: 20px;
    }

    .success-message {
      font-size: 2.2rem; /* Larger, bolder message */
      font-weight: 700;
      color: var(--dark-text);
      margin-top: 0; /* Remove default top margin */
      margin-bottom: 15px;
    }

    .success-text {
      color: var(--light-text);
      font-size: 1.1rem; /* Slightly larger text */
      margin: 0 0 40px; /* More space before button */
      line-height: 1.8; /* Better line spacing */
    }

    .btn-home {
      padding: 15px 35px; /* Larger padding for button */
      font-size: 1.2rem; /* Larger font for button */
      background-color: var(--primary-color);
      border: none;
      color: var(--white);
      border-radius: 50px; /* Pill-shaped button */
      font-weight: 600;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .btn-home:hover {
      background-color: #e06000;
      transform: translateY(-3px); /* Lift effect on hover */
      box-shadow: 0 8px 15px rgba(0,0,0,0.3); /* Stronger shadow on hover */
    }

    @media (max-width: 768px) {
      .success-container {
        margin: 20px; /* More margin on smaller screens */
        padding: 30px;
        border-radius: 15px;
      }
      .success-icon {
        font-size: 60px;
      }
      .success-message {
        font-size: 1.8rem;
      }
      .success-text {
        font-size: 1rem;
        margin-bottom: 30px;
      }
      .btn-home {
        padding: 12px 28px;
        font-size: 1.1rem;
      }
    }
  </style>
</head>
<body>
  <div class="success-container">
    <div class="success-icon">✅</div>
    <div class="success-message">Payment Successful!</div>
    <div class="success-text">Thank you for your order. Your purchase has been successfully completed. A confirmation email with your order details has been sent to your registered email address.</div>
    <a href="/" class="btn btn-home">Return to Home</a>
  </div>
</body>
</html>
